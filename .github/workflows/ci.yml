name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The tool must survive its own corpus. A checker that cannot be run on itself is
      # asking for a trust it does not extend.
      - run: claim-audit . --scripts 'src/**/*.py' --scripts 'tests/**/*.py'
