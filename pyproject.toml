[project]
name = "claim-audit"
version = "0.2.0"
description = "Flags claim/evidence gaps in research repositories. Phase 1: import provenance."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claim-audit = "claim_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
